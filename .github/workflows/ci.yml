name: CI

on:
  pull_request:
  push:
    branches: [test, staging, main]

# Read-only: tests use throwaway tokens and an in-process database. No secrets are used.
permissions:
  contents: read

jobs:
  test:
    name: Tests, build and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (current LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Type check (strict)
        run: npm run typecheck
